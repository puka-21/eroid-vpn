[package]
name = "eroid-vpn"
version = "1.0.0"
edition = "2021"

[dependencies]
eframe = "0.28"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
base64 = "0.22"
url = "2.5"
ureq = { version = "2.10", features = ["tls"] }
winreg = "0.52"
windows-sys = { version = "0.59", features = ["Win32_UI_Shell", "Win32_Networking_WinInet"] }
flate2 = "1.0"
